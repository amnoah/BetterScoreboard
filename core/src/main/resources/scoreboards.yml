# A few notes before you start modifying this:
#
# 1.8 - 1.12.2 has a maximum title character count of 32.
# 1.13+ has an unlimited title character count.
#
# 1.8 - 1.12.2 has a maximum line character count of 58.
# 1.13+ has an unlimited line character count.
#
# 1.8 - 1.20.2 only uses the left-aligned text.
# 1.20.3+ uses both left-aligned text and right-aligned.

default:
  title:
    random: false
    speed: 100
    text:
      - "&1This &9is &1the &9default &1scoreboard!"
      - "&9This &1is &9the &1default &9scoreboard!"
  line1:
    left-aligned:
      random: false
      speed: 20
      text:
        - ""
        - "Welcome "
        - "Welcome to "
        - "Welcome to the "
        - "Welcome to the server!"
    right-aligned:
      random: false
      speed: 20
      text:
        - "Welcome to the server!"
        - "to the server!"
        - "the server!"
        - "server!"
        - ""
  line2:
    left-aligned:
      random: false
      speed: 40
      text:
        - '&7Today is %date%.'
        - '&8Today is %date%.'
  line3:
    right-aligned:
      random: false
      speed: 10
      text:
        - '%condition:checkworld%'

nether:
  weight: 15
  criteria:
    - "%world% $ nether"
  title:
    random: false
    speed: 5
    text:
      - "&bThis is the nether scoreboard."
  line1:
    left-aligned:
      random: false
      speed: -1
      text:
        - "&7World | "
    right-aligned:
      random: false
      speed: 10
      text:
        - "&7%world%"
  line2:
    left-aligned:
      random: false
      speed: -1
      text:
        - "&7Ping | "
    right-aligned:
      random: false
      speed: 10
      text:
        - "&7%ping%ms"
  line3:
    left-aligned:
      random: false
      speed: -1
      text:
        - "&7Coordinates | "
    right-aligned:
      random: false
      speed: 10
      text:
        # Placeholder API player placeholders. /papi ecloud download Player
        - '&7%player_x%, %player_y%, %player_z%.'

permission:
  weight: 12
  criteria:
    - "permission:better.scoreboard.permission"
  title:
    random: true
    speed: 100
    text:
      - "&bThis is the permission board!"
      - "&bYou must be OP or have the permission!"
  line1:
    left-aligned:
      random: true
      speed: -1
      text:
        - "&8Your username is %username%."
        - "&8Your gamemode is %gamemode%."
  line2:
    left-aligned:
      random: false
      speed: 10
      text:
        - "&7Your ping is:"
        - "&8Your ping is:"
    right-aligned:
      random: false
      speed: 10
      text:
        - "&7%ping%"
        - "&8%ping%"
  line3:
    left-aligned:
      mode: OR
      criteria:
        - "%world% -| nether"
      random: true
      speed: 10
      text:
        - "This is left aligned nether text!"
    right-aligned:
      random: false
      speed: 20
      text:
        - "This is aligned to the right!"
  line4:
    right-aligned:
      mode: OR
      criteria:
        - "%world% -| nether"
      speed: -1
      text:
        - "This line only shows up in the nether!"
  line5:
    left-aligned:
      speed: -1
      text:
        - "This is the 5th line!"